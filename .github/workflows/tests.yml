# Runs the tests that need no game data on every push and pull request.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Migration and RNG tests
        run: |
          ruby test/migrate_test.rb
          ruby test/mt19937_test.rb
      - name: CLI sanity
        run: bin/rmxp help
